<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doctors | Healthcare+</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
  </head>
  <body data-shell="staff" data-page="doctors">
    <div data-staff-layout></div>
    <main class="staff-content">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Staff workspace</p>
          <h1>Doctor management</h1>
          <p>Maintain the fictional provider directory used by the demo.</p>
        </div>
        <button class="btn btn-primary" data-add-doctor type="button">
          Add doctor
        </button>
      </div>
      <section class="card">
        <label
          >Search doctors<input
            class="input"
            data-doctor-search
            type="search"
            placeholder="Name or department"
        /></label>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Doctor</th>
                <th scope="col">Department</th>
                <th scope="col">Consultation</th>
                <th scope="col">Fee</th>
                <th scope="col">Status</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody data-doctor-table></tbody>
          </table>
        </div>
      </section>
      <dialog data-doctor-dialog aria-labelledby="doctor-dialog-title">
        <form class="dialog-card" data-doctor-form>
          <button
            class="dialog-close"
            data-close-doctor
            type="button"
            aria-label="Close"
          >
            ×
          </button>
          <h2 id="doctor-dialog-title" data-doctor-form-title>Add doctor</h2>
          <input type="hidden" name="id" /><label
            >Name<input
              class="input"
              name="name"
              required
              maxlength="80" /></label
          ><label
            >Department<select class="input" name="department" required>
              <option value="">Choose department</option>
              <option>General Medicine</option>
              <option>Cardiology</option>
              <option>Dermatology</option>
            </select></label
          ><label
            >Consultation minutes<input
              class="input"
              name="consultationMinutes"
              type="number"
              min="5"
              max="120"
              value="15"
              required /></label
          ><label
            >Fee<input
              class="input"
              name="fee"
              type="number"
              min="0"
              step="50"
              value="500"
              required
          /></label>
          <div class="dialog-actions">
            <button class="btn btn-primary" type="submit">Save doctor</button
            ><button class="btn btn-secondary" data-close-doctor type="button">
              Close
            </button>
          </div>
        </form>
      </dialog>
    </main>
    <script src="../../js/mock-data.js" defer></script>
    <script src="../../js/shared-state.js" defer></script>
    <script src="../../js/utils.js" defer></script>
    <script src="../../js/main.js" defer></script>
    <script src="../../js/admin.js" defer></script>
  </body>
</html>
